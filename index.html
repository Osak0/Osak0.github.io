<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osako 的个人网站</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header" id="top">
      <h1>Osako 的个人网站</h1>
      <p>请选择你要访问的栏目。</p>
      <nav>
        <a href="index.html">主页</a>
        <a href="blog.html">博客</a>
        <a href="profile.html">个人资料库</a>
        <a href="notes.html">分类笔记</a>
        <a href="gallery.html">照片墙</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <h2>栏目导航</h2>
        <div class="grid">
          <article class="blog-item">
            <h3>博客展示</h3>
            <p>查看我的博客内容与最近更新。</p>
            <a href="blog.html">进入博客</a>
          </article>
          <article class="blog-item">
            <h3>个人资料库</h3>
            <p>查看我的基础资料和兴趣方向。</p>
            <a href="profile.html">进入资料库</a>
          </article>
          <article class="blog-item">
            <h3>分类笔记</h3>
            <p>按分类记录与保存你的笔记内容。</p>
            <a href="notes.html">进入笔记</a>
          </article>
          <article class="blog-item">
            <h3>照片墙</h3>
            <p>上传并浏览个人照片墙。</p>
            <a href="gallery.html">进入照片墙</a>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <a href="#top">回到顶部</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
